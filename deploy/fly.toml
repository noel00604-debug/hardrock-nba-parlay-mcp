# Fly.io fallback deployment (see deploy/README.md section 6).
# Run `fly launch --no-deploy` once; it will ask for the app name and may rewrite this file.
# Keep the always-on settings below; `fly launch` defaults would stop the Machine when idle.
# Pricing and region facts: docs.fly.io/about/pricing and /reference/regions, retrieved 2026-10-19.

app = "CHANGE-ME-BEFORE-DEPLOY"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HRNBA_HOST = "0.0.0.0"
  HRNBA_PORT = "8080"
  HRNBA_AUTH_MODE = "builtin_oauth"
  HRNBA_LOG_LEVEL = "INFO"
  # HRNBA_PUBLIC_URL, HRNBA_SECRET_KEY, HRNBA_DATABASE_URL, HRNBA_ODDS_API_KEY are secrets:
  # set them with `fly secrets set ...`, never here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.healthz]
      path = "/healthz"
      interval = "30s"
      timeout = "5s"
      method = "GET"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
